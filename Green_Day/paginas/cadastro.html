<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Day - Cadastro</title>

    <!-- Caminho para o CSS -->
    <link rel="stylesheet" href="../css/cadastro.css">
</head>

<body>

    <main class="pagina-cadastro">

        <!-- Lado esquerdo -->
        <section class="lado-esquerdo">

            <div class="logo">
                GREEN<br>
                <span>DAY</span>
            </div>

            <div class="conteudo-esquerdo">

                <h1>
                    Onde a <span>inovação</span> faz a<br>
                    terra produzir mais.
                </h1>

                <div class="linha"></div>

                <p>
                    Tecnologia e gestão inteligente para<br>
                    aumentar sua produtividade e colher<br>
                    melhores resultados.
                </p>

                <div class="recursos">

                    <div class="recurso">
                        <div class="icone">⌁</div>
                        <span>Monitoramento<br>de Lavouras</span>
                    </div>

                    <div class="recurso">
                        <div class="icone">☼</div>
                        <span>Previsão do Tempo</span>
                    </div>

                    <div class="recurso">
                        <div class="icone">♧</div>
                        <span>Controle de Máquinas</span>
                    </div>

                </div>

            </div>

        </section>


        <!-- Lado direito -->
        <section class="lado-direito">

            <div class="formulario">

                <h2>Cadastre-se</h2>

                <p class="subtitulo">
                    Preencha os campos abaixo:
                </p>

                <form action="#" method="post">

                    <input type="text" name="nome" placeholder="Nome:" required>

                    <input type="email" name="email" placeholder="E-mail:" required>

                    <input type="password" name="senha" placeholder="Crie sua senha:" required>

                    <input type="text" name="cpf_cnpj" placeholder="CPF ou CNPJ:" required>

                    <input type="tel" name="telefone" placeholder="Telefone:" required>

                    <button type="submit" href="/index.html">
                        Cadastrar
                    </button>

                </form>

                <p class="login">
                    Já possui uma conta?
                    <a href="../login/login.html">Faça login.</a>
                </p>

            </div>

        </section>

    </main>

</body>

</html>
