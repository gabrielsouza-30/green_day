<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueceu a senha - Green Day</title>
    <link rel="stylesheet" href="/css/esquci-senha3.css">
    <!-- Font Awesome para os ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="container">
        <!-- Lado Esquerdo: Hero/Banner -->
        <section class="left-section">

            <div class="overlay"></div>

            <header class="logo">
                <span>GREEN</span>
                <span>DAY</span>
            </header>

            <div class="hero-content">
                <h1>Conectando <span>inteligência</span> ao solo para impulsionar a sua produção.</h1>
                <p>Ferramentas de gestão e monitoramento para você tomar decisões certas no momento exato e maximizar
                    seus ganhos.</p>

                <div class="features">
                    <div class="feature-item">
                        <i class="fa-solid fa-sitemap"></i>
                        <span>Mapeamento de Lavouras</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-wind"></i>
                        <span>Inteligência Meteorológica</span>
                    </div>
                    <div class="feature-item">
                        <i class="fa-solid fa-tractor"></i>
                        <span>Gestão Eficiente de Maquinário</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Lado Direito: Formulário -->
       <div class="card">
    <h1>Crie uma nova senha</h1>

    <div class="form-group">
      <label for="new-password">Nova senha</label>
      <div class="input-wrapper">
        <input type="password" id="new-password" placeholder="Digite nova senha">
        <span class="toggle-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
          </svg>
        </span>
      </div>
    </div>

    <div class="form-group">
      <label for="confirm-password">Confirmar senha</label>
      <div class="input-wrapper">
        <input type="password" id="confirm-password" placeholder="Digite a senha novamente">
        <span class="toggle-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path>
            <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path>
            <path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path>
            <line x1="2" y1="2" x2="22" y2="22"></line>
          </svg>
        </span>
      </div>
    </div>

    <button class="submit-btn" type="submit">Redefinir senha</button>
  </div>
</body>

</html>
