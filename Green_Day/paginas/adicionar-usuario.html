<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Adicionar Usuário | Green Day</title>

    <link rel="stylesheet" href="/css/adicionar-usuario.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

    <header>


        <nav class="header">

            <img src="/img/logo-green-day.png" class="logo">

            <nav class="menu">
                <a href="/index.html">Home</a>
                <a href="/paginas/sobre.html">Sobre</a>
                <a href="/paginas/propriedades.html">Propriedades</a>
                <a href="/paginas/usuario.html">Usuários</a>
            </nav>

            <a href="/paginas/login.html" class="login">
                <i class="fa-regular fa-user"></i>
                Login
            </a>


        </nav>

        <!-- Ícones -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    </header>


    <!-- CONTEÚDO PRINCIPAL -->
    <main class="container">

        <!-- TÍTULO -->
        <section class="pagina-titulo">

            <div>
                <h2>Adicionar usuário</h2>
                <p>Cadastre um novo usuário no sistema Green Day.</p>
            </div>

            <i class="fa-solid fa-user-plus icone-titulo"></i>

        </section>


        <!-- FORMULÁRIO -->
        <section class="card-form">

            <div class="card-header">
                <h3>
                    <i class="fa-solid fa-user"></i>
                    Dados do usuário
                </h3>

                <span class="tag">Novo cadastro</span>
            </div>

            <form action="#" method="post" onsubmit="event.preventDefault(); alert('Usuario adicionado');">

                <div class="form-grid">

                    <!-- Nome -->
                    <div class="campo">
                        <label for="nome">Nome completo</label>

                        <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required>
                    </div>


                    <!-- E-mail -->
                    <div class="campo">
                        <label for="email">E-mail</label>

                        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
                    </div>


                    <!-- Telefone -->
                    <div class="campo">
                        <label for="telefone">Telefone</label>

                        <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000">
                    </div>


                    <!-- Perfil -->
                    <div class="campo">
                        <label for="perfil">Perfil de acesso</label>

                        <select id="perfil" name="perfil" required>
                            <option value="">Selecione um perfil</option>
                            <option value="Administrador">Administrador</option>
                            <option value="Técnico">Técnico</option>
                            <option value="Produtor">Produtor</option>
                        </select>
                    </div>


                    <!-- Senha -->
                    <div class="campo">
                        <label for="senha">Senha</label>

                        <input type="password" id="senha" name="senha" placeholder="Digite uma senha" required>
                    </div>


                    <!-- Status -->
                    <div class="campo">
                        <label for="status">Status do usuário</label>

                        <select id="status" name="status">
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                        </select>
                    </div>

                </div>


                <!-- BOTÕES -->
                <div class="botoes">

                    <!-- Botão Cancelar -->
                    <a href="usuario.html" class="btn btn-cancelar">
                        <i class="fa-solid fa-arrow-left"></i>
                        Cancelar
                    </a>
                    <button type="submit" class="btn btn-salvar">
                        <i class="fa-solid fa-user-plus"></i>
                        Cadastrar usuário
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-container">

            <!-- Logo -->
            <div class="logo">
                <h2>GREEN</h2>
                <h2>DAY</h2>
            </div>

            <hr>

            <div class="footer-content">

                <!-- Frase -->
                <div class="footer-text">
                    <p>Green Day – Onde a inovação faz a terra produzir mais.</p>
                </div>

                <!-- Contato -->
                <div class="footer-right">

                    <div class="telefone">
                        <i class="fa-solid fa-phone"></i>
                        <span>+55 11 99999-9999</span>
                    </div>

                    <!-- Redes sociais -->
                    <div class="redes">

                        <a href="#">
                            <i class="fa-brands fa-instagram"></i>
                        </a>

                        <a href="#">
                            <i class="fa-brands fa-x-twitter"></i>
                        </a>

                        <a href="#">
                            <i class="fa-brands fa-whatsapp"></i>
                        </a>

                    </div>

                </div>

            </div>

            <!-- Copyright -->
            <div class="copyright">
                © 2026 Todos os direitos reservados a Green Day
            </div>

        </div>

    </footer>

</body>

</html>
